name: Build JazzWG for TestFlight
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Create signing profiles first, then build and upload'
        type: choice
        options: [provision, testflight]
        default: testflight
permissions:
  contents: read
concurrency:
  group: jazzwg-testflight
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # TEAMID is a non-secret identifier consumed by configure-ci.py.
      TEAMID: ${{ secrets.JAZZWG_TEAM_ID }}
      JAZZWG_TEAM_ID: ${{ secrets.JAZZWG_TEAM_ID }}
      JAZZWG_SIGNING_TOKEN: ${{ secrets.JAZZWG_SIGNING_TOKEN }}
      JAZZWG_API_KEY_ID: ${{ secrets.JAZZWG_API_KEY_ID }}
      JAZZWG_API_ISSUER_ID: ${{ secrets.JAZZWG_API_ISSUER_ID }}
      JAZZWG_API_PRIVATE_KEY: ${{ secrets.JAZZWG_API_PRIVATE_KEY }}
      MATCH_PASSWORD: ${{ secrets.JAZZWG_SIGNING_PASSWORD }}
      APP_ID_IOS: 'com.jazztin98.jazzwg'
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate required secrets
        run: |
          for name in JAZZWG_TEAM_ID JAZZWG_SIGNING_TOKEN JAZZWG_API_KEY_ID JAZZWG_API_ISSUER_ID JAZZWG_API_PRIVATE_KEY MATCH_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing $name. Follow AUTOSWITCH.md."; exit 1; fi
          done
      - uses: actions/setup-go@v5
        with:
          go-version: '1.19.13'
          cache-dependency-path: Sources/WireGuardKitGo/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Configure identifiers
        run: python3 scripts/configure-ci.py
      - name: Test switch policy
        run: |
          swiftc Sources/Shared/Model/AutoSwitchPolicy.swift Tests/AutoSwitchPolicyTests.swift -o "$RUNNER_TEMP/policy-tests"
          "$RUNNER_TEMP/policy-tests"
      - name: Create signing profiles
        if: inputs.operation == 'provision'
        run: bundle exec fastlane ios provision
      - name: Build and upload
        if: inputs.operation == 'testflight'
        run: bundle exec fastlane ios testflight
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-logs
          path: build/logs
          if-no-files-found: ignore
